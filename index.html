<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תוכנת אוטובוסים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c2a3a;
    --muted: #5b6b7c;
    --line: #c9d3dd;
    --paper: #f3f6f9;
    --card: #ffffff;
    --accent: #1f5f8b;
    --accent-dark: #174a6d;
    --ok: #2e7d4f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Assistant", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 520px;
    background: var(--card);
    border-top: 6px solid var(--accent);
    border-radius: 4px 4px 12px 12px;
    padding: 36px 32px 32px;
    box-shadow: 0 12px 30px -18px rgba(28, 42, 58, .45);
  }
  h1 { margin: 0 0 6px; font-size: 2rem; font-weight: 800; }
  .lead { margin: 0 0 28px; color: var(--muted); line-height: 1.6; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field { margin-bottom: 18px; }
  input, textarea {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    color: var(--ink);
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    background: #fff;
  }
  textarea { min-height: 140px; resize: vertical; line-height: 1.6; }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31, 95, 139, .18);
  }
  .row { display: flex; gap: 14px; }
  .row .field { flex: 1; }
  button {
    width: 100%;
    font: inherit;
    font-size: 1.1rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    padding: 14px;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .req { color: #b03a2e; }
  .btn {
    display: block; width: 100%; text-align: center; text-decoration: none;
    font: inherit; font-size: 1.05rem; font-weight: 700; color: #fff;
    background: var(--accent); border: none; border-radius: 8px;
    padding: 13px; margin-bottom: 10px; cursor: pointer;
  }
  .btn.alt { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
  .link { background: none; color: var(--muted); font-weight: 600; text-decoration: underline; padding: 6px; }
  .link:hover { background: none; color: var(--ink); }
  .hidden { display: none !important; }
  /* ===== התחברות ===== */
  .topbar {
    position: fixed; top: 0; right: 0; left: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px; background: var(--card);
    border-bottom: 1px solid var(--line); z-index: 10;
  }
  .topbar .who { font-weight: 600; color: var(--muted); }
  .small-btn {
    font: inherit; font-weight: 700; font-size: .95rem;
    padding: 8px 16px; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #fff; border: none; width: auto;
  }
  .small-btn.alt { background: #fff; color: var(--accent); border: 1.5px solid var(--accent); }
  body { padding-top: 80px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(28,42,58,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; z-index: 20;
  }
  .modal {
    width: 100%; max-width: 400px; background: var(--card);
    border-radius: 12px; padding: 26px 24px;
  }
  .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--line); }
  .tabs button {
    flex: 1; background: none; color: var(--muted); border: none;
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    border-radius: 0; padding: 10px; font-size: 1.05rem;
  }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); }
  .tabs button:hover { background: none; color: var(--ink); }
  .google {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: #fff; color: var(--ink); border: 1.5px solid var(--line);
    margin-bottom: 16px;
  }
  .google:hover { background: var(--paper); }
  .or { text-align: center; color: var(--muted); margin: 0 0 14px; }
  .msg { min-height: 1.4em; margin: 10px 0 0; font-weight: 600; color: #b03a2e; }
  .close { background: none; color: var(--muted); margin-top: 8px; padding: 8px; font-size: 1rem; }
  .close:hover { background: none; color: var(--ink); }
  /* ===== צ'אט ===== */
  .chat-fab {
    position: fixed; bottom: 22px; left: 22px; z-index: 15;
    width: 62px; height: 62px; border-radius: 50%; padding: 0;
    font-size: 1.8rem; line-height: 62px; text-align: center;
    box-shadow: 0 8px 20px -6px rgba(28,42,58,.6);
    transition: transform .15s;
  }
  .chat-fab:hover { transform: scale(1.08); }
  .chat-fab .dot {
    position: absolute; top: 2px; right: 2px; width: 16px; height: 16px;
    background: #d9412f; border: 2px solid #fff; border-radius: 50%;
  }
  .chat-box {
    position: fixed; bottom: 20px; left: 20px; z-index: 16;
    width: min(360px, calc(100vw - 40px)); height: min(520px, calc(100vh - 110px));
    background: var(--card); border-radius: 12px; border: 1px solid var(--line);
    box-shadow: 0 16px 40px -12px rgba(28,42,58,.5);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    background: var(--accent); color: #fff; padding: 12px 14px; font-weight: 700;
  }
  .chat-head button {
    width: auto; background: none; color: #fff; padding: 2px 8px; font-size: 1.2rem;
  }
  .chat-head button:hover { background: rgba(255,255,255,.15); }
  .chat-list, .chat-msgs { flex: 1; overflow-y: auto; padding: 12px; background: var(--paper); }
  .chat-item {
    display: block; width: 100%; text-align: right; background: #fff; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px;
    font-size: 1rem; font-weight: 600;
  }
  .chat-item small { display: block; font-weight: 400; color: var(--muted); }
  .chat-item.new { border-color: var(--accent); border-width: 2px; }
  .chat-item:hover { background: #eef3f8; }
  .bubble {
    max-width: 80%; padding: 8px 12px; border-radius: 12px; margin-bottom: 8px;
    line-height: 1.5; white-space: pre-wrap; word-wrap: break-word;
  }
  .bubble.me { background: var(--accent); color: #fff; margin-right: auto; border-bottom-left-radius: 3px; }
  .bubble.them { background: #fff; border: 1px solid var(--line); margin-left: auto; border-bottom-right-radius: 3px; }
  .bubble time { display: block; font-size: .75rem; opacity: .7; margin-top: 2px; }
  .chat-empty { text-align: center; color: var(--muted); margin-top: 30px; }
  .chat-send { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); background: #fff; }
  .chat-send textarea { min-height: 44px; height: 44px; resize: none; padding: 10px; }
  .chat-send button { width: auto; padding: 0 16px; }
  @media (max-width: 480px) {
    .row { flex-direction: column; gap: 0; }
    .wrap { padding: 28px 20px 24px; }
  }
</style>
</head>
<body>
  <header class="topbar">
    <span class="who" id="who">אורח</span>
    <div>
      <button class="small-btn" id="openLogin">התחברות / הרשמה</button>
      <button class="small-btn alt hidden" id="logout">התנתקות</button>
    </div>
  </header>

  <div class="overlay hidden" id="overlay">
    <div class="modal">
      <div class="tabs">
        <button type="button" id="tabLogin" class="on">התחברות</button>
        <button type="button" id="tabReg">הרשמה</button>
      </div>

      <button type="button" class="google" id="googleBtn">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.4 13.7 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 7.1-10 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.2-13.5-9.9l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>
        המשך עם Google
      </button>

      <p class="or">או עם אימייל וסיסמה</p>

      <div class="field hidden" id="nameField">
        <label for="regName">שם</label>
        <input id="regName" type="text">
      </div>
      <div class="field">
        <label for="authEmail">אימייל</label>
        <input id="authEmail" type="email" dir="ltr">
      </div>
      <div class="field">
        <label for="authPass">סיסמה</label>
        <input id="authPass" type="password" dir="ltr">
      </div>

      <button type="button" id="authSubmit">התחברות</button>
      <p class="msg" id="authMsg"></p>
      <button type="button" class="close" id="closeLogin">סגירה</button>
    </div>
  </div>
  <main class="wrap">
    <h1>תוכנת אוטובוסים</h1>
    <p class="lead">להורדה והתקנה של התוכנה לחצו על הכפתור. לשאלות, התחברו ופתחו את הצ'אט 💬 בפינת המסך.</p>

    <a class="btn" style="margin-bottom:0" href="https://drive.google.com/uc?export=download&id=17pnsqzQiw_gYKFGePAV7QIis2bAkq5S-">⬇ הורדת תוכנת אוטובוסים</a>
  </main>



  <!-- ===== צ'אט ===== -->
  <button type="button" class="chat-fab hidden" id="chatFab" title="צ'אט">💬<span class="dot hidden" id="chatDot"></span></button>
  <div class="chat-box hidden" id="chatBox">
    <div class="chat-head">
      <button type="button" id="chatBack" class="hidden" title="חזרה לרשימה">→</button>
      <span id="chatTitle">צ'אט</span>
      <button type="button" id="chatClose" title="סגירה">✕</button>
    </div>
    <div class="chat-list hidden" id="chatList"></div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-send" id="chatSend">
      <textarea id="chatInput" placeholder="כתבו הודעה..."></textarea>
      <button type="button" id="chatSendBtn">שליחה</button>
    </div>
  </div>

<!-- ===== התחברות עם Firebase ===== -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
  // ↓↓↓ כאן מדביקים את ההגדרות מ-Firebase (ראו הסבר) ↓↓↓
  const firebaseConfig = {
    apiKey: "AIzaSyAKq6cEtOiw2q__8W8lN-zUaQprSMG1vmw",
    authDomain: "project-6009216979838534734.firebaseapp.com",
    projectId: "project-6009216979838534734",
    appId: "1:135251714538:web:db532e77bb5665b4205293"
  };
  // ↑↑↑ עד כאן ↑↑↑

  if (JSON.stringify(firebaseConfig).includes("הדביקו-כאן")) {
    alert("עוד לא הודבקו הגדרות Firebase בקובץ, ולכן ההתחברות לא תעבוד. ראו הסבר בשלב א.");
  }
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const $ = id => document.getElementById(id);
  let mode = "login";

  const errors = {
    "auth/invalid-email": "כתובת האימייל לא תקינה",
    "auth/missing-password": "צריך להקליד סיסמה",
    "auth/weak-password": "הסיסמה צריכה להיות לפחות 6 תווים",
    "auth/email-already-in-use": "כבר יש חשבון עם האימייל הזה. נסו להתחבר",
    "auth/invalid-credential": "אימייל או סיסמה שגויים",
    "auth/wrong-password": "אימייל או סיסמה שגויים",
    "auth/user-not-found": "לא נמצא חשבון עם האימייל הזה",
    "auth/popup-closed-by-user": "חלון Google נסגר לפני סיום ההתחברות. אם החלון נסגר לבד או נשאר ריק, ייתכן שהסינון חוסם אותו. נסו אימייל וסיסמה",
    "auth/popup-blocked": "הדפדפן חסם את חלון Google. אפשרו חלונות קופצים לאתר ונסו שוב",
    "auth/internal-error": "ההתחברות נכשלה. אם יש לכם סינון, ייתכן שהוא חוסם את שירות ההתחברות. נסו אימייל וסיסמה",
    "auth/unauthorized-domain": "האתר הזה עוד לא מאושר ב-Firebase. בעל האתר צריך להוסיף אותו ב'דומיינים מורשים'",
    "auth/network-request-failed": "ההתחברות נחסמה. אם יש לכם סינון (נטפרי, נתיב, רימון ודומיהם), ייתכן שהוא חוסם את שירות ההתחברות. נסו אימייל וסיסמה, או בקשו מהסינון לפתוח את האתר ואת שירות ההתחברות של גוגל (Firebase)",
    "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "הגדרות Firebase לא הודבקו נכון בקובץ",
    "auth/operation-not-supported-in-this-environment": "ההתחברות עובדת רק כשהדף נמצא באתר ברשת, לא כקובץ במחשב"
  };
  const showErr = e => { $("authMsg").textContent = errors[e.code] || "שגיאה: " + e.message; };

  function setMode(m) {
    mode = m;
    $("tabLogin").classList.toggle("on", m === "login");
    $("tabReg").classList.toggle("on", m === "reg");
    $("nameField").classList.toggle("hidden", m === "login");
    $("authSubmit").textContent = m === "login" ? "התחברות" : "הרשמה";
    $("authMsg").textContent = "";
  }
  $("tabLogin").onclick = () => setMode("login");
  $("tabReg").onclick = () => setMode("reg");
  $("openLogin").onclick = () => $("overlay").classList.remove("hidden");
  $("closeLogin").onclick = () => $("overlay").classList.add("hidden");

  $("googleBtn").onclick = () =>
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(showErr);

  $("authSubmit").onclick = async () => {
    const email = $("authEmail").value.trim(), pass = $("authPass").value;
    $("authMsg").textContent = "";
    try {
      if (mode === "login") {
        await auth.signInWithEmailAndPassword(email, pass);
      } else {
        const r = await auth.createUserWithEmailAndPassword(email, pass);
        const name = $("regName").value.trim();
        if (name) { await r.user.updateProfile({ displayName: name }); updateBar(r.user); }
      }
    } catch (e) { showErr(e); }
  };

  $("logout").onclick = () => auth.signOut();

  function updateBar(user) {
    if (user) {
      $("who").textContent = "שלום, " + (user.displayName || user.email);
      $("openLogin").classList.add("hidden");
      $("logout").classList.remove("hidden");
      $("overlay").classList.add("hidden");
    } else {
      $("who").textContent = "אורח";
      $("openLogin").classList.remove("hidden");
      $("logout").classList.add("hidden");
    }
  }
  auth.onAuthStateChanged(user => { updateBar(user); startChat(user); });

  /* ===== צ'אט: משתמשים כותבים, המנהל רואה ועונה ===== */
  const ADMIN_EMAIL = "yosefdayan2018@gmail.com"; // המייל של בעל האתר
  const db = firebase.firestore();
  let me = null, isAdmin = false, openUid = null;
  let stopList = null, stopMsgs = null, stopDot = null;

  const fmt = ts => ts ? ts.toDate().toLocaleString("he-IL", { day: "numeric", month: "numeric", hour: "2-digit", minute: "2-digit" }) : "";

  function startChat(user) {
    if (stopList) stopList(); if (stopMsgs) stopMsgs(); if (stopDot) stopDot();
    stopList = stopMsgs = stopDot = null;
    $("chatDot").classList.add("hidden");
    me = user;
    $("chatBox").classList.add("hidden");
    if (!user) { $("chatFab").classList.add("hidden"); return; }
    isAdmin = user.email === ADMIN_EMAIL && user.emailVerified;
    $("chatFab").title = isAdmin ? "הודעות מהמשתמשים" : "צ'אט איתנו";
    $("chatFab").classList.remove("hidden");
    // נקודה אדומה על העיגול כשיש הודעה חדשה
    if (isAdmin) {
      stopDot = db.collection("chats").where("unreadAdmin", "==", true)
        .onSnapshot(q => $("chatDot").classList.toggle("hidden", q.empty), () => {});
    } else {
      stopDot = db.collection("chats").doc(user.uid)
        .onSnapshot(d => $("chatDot").classList.toggle("hidden", !(d.exists && d.data().unreadUser)), () => {});
    }
  }

  $("chatFab").onclick = () => {
    $("chatFab").classList.add("hidden");
    $("chatBox").classList.remove("hidden");
    isAdmin ? showList() : openChat(me.uid, "צ'אט איתנו");
  };
  $("chatClose").onclick = () => {
    $("chatBox").classList.add("hidden");
    $("chatFab").classList.remove("hidden");
  };
  $("chatBack").onclick = showList;

  // מנהל: רשימת כל השיחות
  function showList() {
    if (stopMsgs) { stopMsgs(); stopMsgs = null; }
    openUid = null;
    $("chatTitle").textContent = "שיחות";
    $("chatBack").classList.add("hidden");
    $("chatMsgs").classList.add("hidden");
    $("chatSend").classList.add("hidden");
    $("chatList").classList.remove("hidden");
    if (stopList) return;
    stopList = db.collection("chats").orderBy("updated", "desc").onSnapshot(snap => {
      const list = $("chatList");
      list.innerHTML = snap.empty ? '<p class="chat-empty">עוד אין הודעות</p>' : "";
      snap.forEach(d => {
        const c = d.data();
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chat-item" + (c.unreadAdmin ? " new" : "");
        b.innerHTML = "<span></span><small></small>";
        b.firstChild.textContent = (c.unreadAdmin ? "🔵 " : "") + (c.name || c.email);
        b.lastChild.textContent = (c.last || "") + " · " + fmt(c.updated);
        b.onclick = () => openChat(d.id, c.name || c.email);
        list.appendChild(b);
      });
    }, err => { $("chatList").innerHTML = '<p class="chat-empty">שגיאה בטעינה: ' + err.code + '</p>'; });
  }

  // פתיחת שיחה אחת
  function openChat(uid, title) {
    if (stopMsgs) stopMsgs();
    openUid = uid;
    $("chatTitle").textContent = title;
    $("chatBack").classList.toggle("hidden", !isAdmin);
    $("chatList").classList.add("hidden");
    $("chatMsgs").classList.remove("hidden");
    $("chatSend").classList.remove("hidden");
    const ref = db.collection("chats").doc(uid);
    ref.set(isAdmin ? { unreadAdmin: false } : { unreadUser: false }, { merge: true }).catch(() => {});
    stopMsgs = ref.collection("messages").orderBy("ts").onSnapshot(snap => {
      const box = $("chatMsgs");
      box.innerHTML = snap.empty ? '<p class="chat-empty">' + (isAdmin ? "אין הודעות" : "כתבו לנו הודעה ונענה בהקדם") + "</p>" : "";
      snap.forEach(d => {
        const m = d.data();
        const mine = isAdmin ? m.from === "admin" : m.from === "user";
        const div = document.createElement("div");
        div.className = "bubble " + (mine ? "me" : "them");
        div.textContent = m.text;
        const t = document.createElement("time");
        t.textContent = fmt(m.ts);
        div.appendChild(t);
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }, err => { $("chatMsgs").innerHTML = '<p class="chat-empty">שגיאה בטעינה: ' + err.code + '</p>'; });
  }

  async function sendMsg() {
    const text = $("chatInput").value.trim();
    if (!text || !openUid) return;
    $("chatInput").value = "";
    const ref = db.collection("chats").doc(openUid);
    const now = firebase.firestore.FieldValue.serverTimestamp();
    const info = { updated: now, last: text.slice(0, 60) };
    if (isAdmin) Object.assign(info, { unreadAdmin: false, unreadUser: true });
    else Object.assign(info, { name: me.displayName || "", email: me.email || "", unreadAdmin: true });
    // שני הכתיבות יחד – ההודעה מופיעה מיד בחלון
    const batch = db.batch();
    batch.set(ref, info, { merge: true });
    batch.set(ref.collection("messages").doc(), { text, from: isAdmin ? "admin" : "user", ts: now });
    const timeout = new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), 12000));
    try {
      await Promise.race([batch.commit(), timeout]);
    } catch (e) {
      const why = {
        "permission-denied": "אין הרשאה. צריך להדביק את הכללים (Rules) ב-Firestore וללחוץ פרסום.",
        "not-found": "מסד הנתונים Firestore עוד לא נוצר ב-Firebase.",
        "timeout": "אין חיבור לשרת ההודעות. ייתכן ש-Firestore עוד לא נוצר ב-Firebase, או שהסינון חוסם את firestore.googleapis.com."
      }[e.code] || ("שגיאה: " + (e.code || e.message));
      alert("ההודעה לא נשלחה.\n" + why);
    }
  }
  $("chatSendBtn").onclick = sendMsg;
  $("chatInput").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
</script>
</body>
</html>
