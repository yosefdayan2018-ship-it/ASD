<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>גַּלְגַּל</title>
<style>
  :root{
    --bg: #0b0b0f;
    --bg-elevated: #16161d;
    --ink: #f4f2ec;
    --ink-dim: #9c99a8;
    --accent: #ff4d5e;
    --accent-2: #ffd93d;
    --line: #29293380;
    --radius: 18px;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;}
  body{display:flex;flex-direction:column;}

  /* ---------- Top bar ---------- */
  header{
    position:relative;z-index:20;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;
    background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);
  }
  .logo{
    display:flex;align-items:center;gap:8px;
    font-weight:800;font-size:20px;letter-spacing:.5px;
  }
  .logo .wheel{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--accent);
    border-top-color:var(--accent-2);
    animation:spin 3s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .top-actions{display:flex;gap:8px;}
  .icon-btn{
    background:rgba(255,255,255,.08);
    border:1px solid var(--line);
    color:var(--ink);
    border-radius:999px;
    padding:9px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    display:flex;align-items:center;gap:6px;
    backdrop-filter:blur(6px);
    transition:.15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,.16);}
  .icon-btn.admin{border-color:var(--accent-2);color:var(--accent-2);}

  /* ---------- Feed ---------- */
  #feed{
    flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;
    position:relative;
  }
  .slide{
    height:100%;width:100%;scroll-snap-align:start;
    position:relative;display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  .slide video{
    width:100%;height:100%;object-fit:cover;
  }
  .slide .overlay{
    position:absolute;inset:0;
    background:linear-gradient(0deg, rgba(0,0,0,.65) 0%, transparent 30%, transparent 70%, rgba(0,0,0,.35) 100%);
    pointer-events:none;
  }
  .slide .meta{
    position:absolute;bottom:24px;right:18px;left:18px;
    z-index:5;
  }
  .slide .uploader{font-weight:700;font-size:15px;margin-bottom:4px;}
  .slide .caption{font-size:14px;color:var(--ink-dim);max-width:80%;}
  .slide .tag{
    display:inline-block;margin-top:8px;
    font-size:11px;padding:3px 10px;border-radius:999px;
    background:rgba(255,77,94,.18);color:var(--accent);
    border:1px solid rgba(255,77,94,.4);
  }

  #empty-state{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:10px;
    color:var(--ink-dim);padding:0 40px;
  }
  #empty-state .wheel-big{
    width:64px;height:64px;border-radius:50%;
    border:5px solid var(--accent);border-top-color:var(--accent-2);
    animation:spin 3s linear infinite;margin-bottom:10px;
  }
  #empty-state h2{color:var(--ink);margin:0;font-size:19px;}
  #empty-state p{margin:0;font-size:14px;line-height:1.6;}

  /* ---------- Floating upload button ---------- */
  #fab-upload{
    position:fixed;left:18px;bottom:26px;z-index:30;
    background:linear-gradient(135deg, var(--accent), #ff8a5b);
    color:#fff;border:none;border-radius:999px;
    padding:14px 20px;font-size:14px;font-weight:800;
    display:flex;align-items:center;gap:8px;
    box-shadow:0 8px 24px rgba(255,77,94,.4);
    cursor:pointer;
  }

  /* ---------- Modals ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--bg-elevated);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;width:100%;max-width:380px;
    max-height:86vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 4px;font-size:18px;}
  .modal p.sub{margin:0 0 16px;color:var(--ink-dim);font-size:13px;}
  .modal label{display:block;font-size:12px;color:var(--ink-dim);margin:14px 0 6px;}
  .modal input[type=text], .modal input[type=password], .modal textarea{
    width:100%;background:#0b0b0f;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;
  }
  .modal input[type=file]{
    width:100%;color:var(--ink-dim);font-size:13px;
  }
  .modal textarea{resize:none;height:60px;}
  .btn-row{display:flex;gap:10px;margin-top:20px;}
  .btn{
    flex:1;padding:12px;border-radius:10px;border:none;font-weight:700;
    font-size:14px;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-google{
    width:100%;background:#fff;color:#1f1f1f;border:none;border-radius:10px;
    padding:11px;font-weight:700;font-size:14px;display:flex;align-items:center;
    justify-content:center;gap:10px;cursor:pointer;
  }
  .err{color:var(--accent);font-size:12.5px;margin-top:8px;display:none;}
  .step{display:none;}
  .step.active{display:block;}
  .signed-badge{
    display:flex;align-items:center;gap:10px;background:rgba(80,200,120,.12);
    border:1px solid rgba(80,200,120,.35);border-radius:10px;padding:10px 12px;
    font-size:13px;margin-bottom:6px;
  }
  .signed-badge .dot{width:8px;height:8px;border-radius:50%;background:#4ade80;}

  /* ---------- Admin panel ---------- */
  #admin-panel{
    position:fixed;inset:0;background:var(--bg);z-index:90;display:none;
    flex-direction:column;
  }
  #admin-panel.show{display:flex;}
  .admin-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--line);
  }
  .admin-header h2{margin:0;font-size:17px;}
  .admin-header .sub{font-size:12px;color:var(--ink-dim);margin-top:2px;}
  #pending-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
  .pending-card{
    background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;
  }
  .pending-card video{width:100%;max-height:340px;object-fit:cover;display:block;background:#000;}
  .pending-info{padding:12px 14px;}
  .pending-info .u{font-weight:700;font-size:14px;}
  .pending-info .c{font-size:13px;color:var(--ink-dim);margin-top:3px;}
  .pending-actions{display:flex;gap:10px;padding:0 14px 14px;}
  .approve{flex:1;background:#22c55e;color:#03130a;border:none;border-radius:9px;padding:10px;font-weight:800;cursor:pointer;}
  .reject{flex:1;background:transparent;border:1px solid var(--accent);color:var(--accent);border-radius:9px;padding:10px;font-weight:800;cursor:pointer;}
  #admin-empty{color:var(--ink-dim);text-align:center;padding:60px 20px;font-size:14px;}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="wheel"></span> גַּלְגַּל</div>
  <div class="top-actions">
    <button class="icon-btn admin" id="btn-admin">🛡️ כניסה כמנהל</button>
  </div>
</header>

<div id="feed">
  <div id="empty-state">
    <div class="wheel-big"></div>
    <h2>עדיין אין גלגלים בפיד</h2>
    <p>ברגע שמנהל יאשר סרטון שהועלה, הוא יופיע כאן לכולם.</p>
  </div>
</div>

<button id="fab-upload">⬆️ העלאת גלגל</button>

<!-- Upload modal -->
<div class="modal-backdrop" id="upload-backdrop">
  <div class="modal">
    <h3>העלאת גלגל חדש</h3>
    <p class="sub">הסרטון יישלח לבדיקת מנהל ויופיע בפיד רק לאחר אישור.</p>
    <label>שם משתמש</label>
    <input type="text" id="up-name" placeholder="איך לקרוא לך?">
    <label>כיתוב (אופציונלי)</label>
    <textarea id="up-caption" placeholder="על מה הסרטון?"></textarea>
    <label>קובץ וידאו (עד 15MB, הדגמה)</label>
    <input type="file" id="up-file" accept="video/*">
    <div class="err" id="up-err"></div>
    <div class="btn-row">
      <button class="btn btn-ghost" id="up-cancel">ביטול</button>
      <button class="btn btn-primary" id="up-submit">שליחה לאישור</button>
    </div>
  </div>
</div>

<!-- Admin login modal -->
<div class="modal-backdrop" id="admin-backdrop">
  <div class="modal">
    <div class="step active" id="step-google">
      <h3>כניסה כמנהל</h3>
      <p class="sub">שלב 1 מתוך 2 — התחברות עם גוגל</p>
      <button class="btn-google" id="btn-google-signin">
        <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.7 6.5 29.1 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.7 6.5 29.1 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5 0 9.6-1.9 13-5.1l-6-5c-2 1.4-4.5 2.2-7 2.2-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6 5c-.4.4 6.9-5 6.9-15.5 0-1.2-.1-2.4-.4-3.5z"/></svg>
        המשך עם Google
      </button>
      <div class="err" id="g-err"></div>
    </div>
    <div class="step" id="step-pass">
      <h3>כניסה כמנהל</h3>
      <p class="sub">שלב 2 מתוך 2 — סיסמת מנהל</p>
      <div class="signed-badge"><span class="dot"></span><span id="signed-as">מחובר/ת</span></div>
      <label>סיסמה</label>
      <input type="password" id="admin-pass" placeholder="הזן/י סיסמה">
      <div class="err" id="p-err"></div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="pass-cancel">ביטול</button>
        <button class="btn btn-primary" id="pass-submit">כניסה</button>
      </div>
    </div>
  </div>
</div>

<!-- Admin panel -->
<div id="admin-panel">
  <div class="admin-header">
    <div>
      <h2>לוח ניהול · אישור סרטונים</h2>
      <div class="sub" id="admin-count">0 ממתינים</div>
    </div>
    <button class="icon-btn" id="btn-close-admin">✕ יציאה</button>
  </div>
  <div id="pending-list"></div>
</div>

<script>
const ADMIN_PASSWORD = "7163323";
let googleUser = null;

// ---------- storage helpers ----------
async function getList(key){
  try{
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function setList(key, arr){
  try{
    await window.storage.set(key, JSON.stringify(arr), true);
  }catch(e){ console.error("storage error", e); }
}

function fileToBase64(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=>res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

// ---------- feed rendering ----------
async function renderFeed(){
  const approved = await getList('videos:approved');
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty-state');
  feed.querySelectorAll('.slide').forEach(s=>s.remove());
  if(approved.length === 0){
    empty.style.display = 'flex';
    return;
  }
  empty.style.display = 'none';
  approved.slice().reverse().forEach(v=>{
    const slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML = `
      <video src="${v.url}" playsinline loop muted></video>
      <div class="overlay"></div>
      <div class="meta">
        <div class="uploader">@${escapeHtml(v.uploader)}</div>
        ${v.caption ? `<div class="caption">${escapeHtml(v.caption)}</div>` : ''}
        <span class="tag">מאושר ע"י מנהל</span>
      </div>
    `;
    feed.appendChild(slide);
  });
  setupPlaybackObserver();
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.innerText = s || '';
  return d.innerHTML;
}

function setupPlaybackObserver(){
  const videos = document.querySelectorAll('#feed video');
  const io = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      const vid = e.target;
      if(e.isIntersecting){ vid.play().catch(()=>{}); }
      else { vid.pause(); }
    });
  }, {threshold:0.6});
  videos.forEach(v=>io.observe(v));
}

// ---------- upload flow ----------
const uploadBackdrop = document.getElementById('upload-backdrop');
document.getElementById('fab-upload').onclick = ()=>{
  document.getElementById('up-name').value = '';
  document.getElementById('up-caption').value = '';
  document.getElementById('up-file').value = '';
  document.getElementById('up-err').style.display = 'none';
  uploadBackdrop.classList.add('show');
};
document.getElementById('up-cancel').onclick = ()=> uploadBackdrop.classList.remove('show');

document.getElementById('up-submit').onclick = async ()=>{
  const name = document.getElementById('up-name').value.trim() || 'אורח';
  const caption = document.getElementById('up-caption').value.trim();
  const fileInput = document.getElementById('up-file');
  const errEl = document.getElementById('up-err');
  const file = fileInput.files[0];
  if(!file){
    errEl.textContent = 'יש לבחור קובץ וידאו.';
    errEl.style.display = 'block';
    return;
  }
  if(file.size > 15 * 1024 * 1024){
    errEl.textContent = 'הקובץ גדול מדי להדגמה זו (מקסימום 15MB).';
    errEl.style.display = 'block';
    return;
  }
  const btn = document.getElementById('up-submit');
  btn.disabled = true; btn.textContent = 'מעלה...';
  try{
    const base64 = await fileToBase64(file);
    const pending = await getList('videos:pending');
    pending.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
      uploader: name,
      caption,
      url: base64,
      ts: Date.now()
    });
    await setList('videos:pending', pending);
    uploadBackdrop.classList.remove('show');
    alert('הסרטון נשלח לבדיקת מנהל 🎬');
  }catch(e){
    errEl.textContent = 'שגיאה בהעלאה, נסה/י שוב.';
    errEl.style.display = 'block';
  }finally{
    btn.disabled = false; btn.textContent = 'שליחה לאישור';
  }
};

// ---------- admin login flow ----------
const adminBackdrop = document.getElementById('admin-backdrop');
document.getElementById('btn-admin').onclick = ()=>{
  document.getElementById('step-google').classList.add('active');
  document.getElementById('step-pass').classList.remove('active');
  document.getElementById('g-err').style.display = 'none';
  document.getElementById('p-err').style.display = 'none';
  document.getElementById('admin-pass').value = '';
  adminBackdrop.classList.add('show');
};

document.getElementById('btn-google-signin').onclick = ()=>{
  // Demo Google sign-in (no real OAuth wired up in this environment)
  const email = prompt('הדגמת התחברות Google — הזן/י כתובת Gmail:');
  if(!email){ return; }
  if(!email.includes('@')){
    const err = document.getElementById('g-err');
    err.textContent = 'כתובת אימייל לא תקינה.';
    err.style.display = 'block';
    return;
  }
  googleUser = email;
  document.getElementById('signed-as').textContent = 'מחובר/ת כ-' + email;
  document.getElementById('step-google').classList.remove('active');
  document.getElementById('step-pass').classList.add('active');
};

document.getElementById('pass-cancel').onclick = ()=> adminBackdrop.classList.remove('show');

document.getElementById('pass-submit').onclick = ()=>{
  const val = document.getElementById('admin-pass').value;
  const err = document.getElementById('p-err');
  if(val !== ADMIN_PASSWORD){
    err.textContent = 'סיסמה שגויה.';
    err.style.display = 'block';
    return;
  }
  adminBackdrop.classList.remove('show');
  openAdminPanel();
};

// ---------- admin panel ----------
async function openAdminPanel(){
  document.getElementById('admin-panel').classList.add('show');
  await renderPending();
}
document.getElementById('btn-close-admin').onclick = ()=>{
  document.getElementById('admin-panel').classList.remove('show');
};

async function renderPending(){
  const pending = await getList('videos:pending');
  const list = document.getElementById('pending-list');
  document.getElementById('admin-count').textContent = pending.length + ' ממתינים לאישור';
  list.innerHTML = '';
  if(pending.length === 0){
    list.innerHTML = '<div id="admin-empty">אין סרטונים ממתינים כרגע 🎉</div>';
    return;
  }
  pending.slice().reverse().forEach(v=>{
    const card = document.createElement('div');
    card.className = 'pending-card';
    card.innerHTML = `
      <video src="${v.url}" controls></video>
      <div class="pending-info">
        <div class="u">@${escapeHtml(v.uploader)}</div>
        ${v.caption ? `<div class="c">${escapeHtml(v.caption)}</div>` : ''}
      </div>
      <div class="pending-actions">
        <button class="approve" data-id="${v.id}">✔ אישור</button>
        <button class="reject" data-id="${v.id}">✕ דחייה</button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.approve').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const pendingArr = await getList('videos:pending');
      const idx = pendingArr.findIndex(v=>v.id === id);
      if(idx === -1) return;
      const [item] = pendingArr.splice(idx,1);
      await setList('videos:pending', pendingArr);
      const approved = await getList('videos:approved');
      approved.push(item);
      await setList('videos:approved', approved);
      await renderPending();
      await renderFeed();
    };
  });
  list.querySelectorAll('.reject').forEach(b=>{
    b.onclick = async ()=>{
      const id = b.dataset.id;
      const pendingArr = await getList('videos:pending');
      const idx = pendingArr.findIndex(v=>v.id === id);
      if(idx === -1) return;
      pendingArr.splice(idx,1);
      await setList('videos:pending', pendingArr);
      await renderPending();
    };
  });
}

renderFeed();
</script>
</body>
</html>
